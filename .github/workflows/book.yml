name: Handbook checks and PDF

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  handbook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install tools
        run: |
          python -m pip install -r requirements-dev.txt
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core iverilog
      - name: Verify generated navigation
        run: |
          python tools/book.py toc
          python tools/map_plan.py
          git diff --exit-code -- README.md docs/appendices/d-plan-map.md
      - name: Validate text and examples
        run: |
          python tools/book.py check
          python -m unittest discover -s tools/tests -v
          python tools/check_sv.py
          python tools/simulate.py
      - name: Build and verify PDF
        run: |
          python tools/book.py build
          python tools/check_pdf.py
      - uses: actions/upload-artifact@v4
        with:
          name: systemverilog-handbook
          path: |
            dist/systemverilog.pdf
            dist/systemverilog.md
            build/sv-check.json
            build/simulation.json
